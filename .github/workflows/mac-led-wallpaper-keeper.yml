name: Build LED Wallpaper Keeper (macOS)

on:
  push:
    paths:
      - "mac/LEDWallpaperKeeper/**"
      - ".github/workflows/mac-led-wallpaper-keeper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        working-directory: mac/LEDWallpaperKeeper
        run: UNIVERSAL=1 ./build_app.sh
      - name: Zip
        working-directory: mac/LEDWallpaperKeeper/dist
        run: ditto -c -k --keepParent LEDWallpaperKeeper.app LEDWallpaperKeeper.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LEDWallpaperKeeper
          path: mac/LEDWallpaperKeeper/dist/LEDWallpaperKeeper.zip
      - name: Render test pattern previews
        working-directory: mac/LEDWallpaperKeeper
        run: |
          mkdir -p previews
          B=dist/LEDWallpaperKeeper.app/Contents/MacOS/LEDWallpaperKeeper
          for st in 0 2; do
            $B --render 2560 768 previews/tp${st}_2560x768_cab128.png 128 128 $st
            $B --render 2048 1024 previews/tp${st}_2048x1024_cab128.png 128 128 $st
            $B --render 1920 1080 previews/tp${st}_1920x1080_cab120.png 120 120 $st
            $B --render 768 1536 previews/tp${st}_768x1536_cab128.png 128 128 $st
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TestPatternPreviews
          path: mac/LEDWallpaperKeeper/previews
      - name: Publish previews to ci-previews branch
        working-directory: mac/LEDWallpaperKeeper/previews
        run: |
          git init -q -b ci-previews
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "previews for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-previews
